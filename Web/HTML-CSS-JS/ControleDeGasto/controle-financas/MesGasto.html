<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Mensal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <script>
    // Script rápido anti-piscada: carrega o tema salvo antes da página renderizar
    const temaSalvo = localStorage.getItem("sistema-tema") || "pink";
    document.documentElement.setAttribute("data-theme", temaSalvo);
  </script>
</head>
<body>

  <div id="loading-overlay" class="loading-overlay">
    <div class="cyber-spinner"></div>
    <p class="loading-text">SINCRO-REDE: RECUPERANDO REGISTROS DO BANCO...</p>
  </div>

  <header>
    <h1 id="mes-titulo">Carregando...</h1>
    
    <div style="display: flex; gap: 10px; align-items: center;">
      <select id="theme-selector" class="theme-select" onchange="mudarTema(this.value)">
        <option value="pink">🌸 Rosa Bebê</option>
        <option value="military">🪖 Verde Militar</option>
      </select>
      
      <a href="DatasDeGastos.html" class="history-btn">⬅️ Voltar</a>
      <button onclick="sairDaConta()" class="history-btn btn-logout-cyber">Sair</button>
    </div>
  </header>

  <div class="painel-financas">
    <p>Renda Total no Período: <strong id="renda-display">R$ 0,00</strong></p>
    <p>Total de Gastos Decretados: <strong id="gastos-display">R$ 0,00</strong></p>
    <h3>Balanço Final / Sobra:</h3>
    <h1 class="saldo-destaque" id="saldo-display">R$ 0,00</h1>
  </div>

  <h3 style="margin: 20px 0 10px; letter-spacing: 1px; text-transform: uppercase;">Contas Registradas Deste Mês</h3>
  
  <div class="cards-container" id="lista-contas-passadas"></div>

  <script type="module" src="js/MesGasto.js"></script>
</body>
</html>
