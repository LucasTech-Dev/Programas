<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro | Sistema de Acesso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="max-width: 400px; margin: 100px auto;" class="painel-financas">
    
    <h2 class="neon-text" style="text-align: center; margin-bottom: 10px;">TERMINAL DE ACESSO</h2>
    <p style="font-size: 0.8rem; text-align: center; margin-bottom: 25px; color: var(--text-main);">Identificação de Segurança</p>
    
    <label style="font-weight: bold; display: block; margin-bottom: 5px; color: var(--accent); text-align: left;">ID da Conta (E-mail)</label>
    <input type="email" id="login-email" placeholder="usuario@rede.cyber">
    
    <label style="font-weight: bold; display: block; margin-bottom: 5px; margin-top: 15px; color: var(--accent); text-align: left;">Chave de Acesso (Senha)</label>
    <input type="password" id="login-password" placeholder="******">
    
    <button class="btn-primary" onclick="executarLogin()" style="margin-top: 25px;">INICIAR SESSÃO</button>
    <button class="btn-voltar" onclick="executarCadastro()" style="margin-top: 15px; width: 100%; border: 1px solid var(--accent); color: var(--accent);">REGISTRAR NOVA CREDENCIAL</button>
    
  </div>
  
  <script type="module" src="js/login.js"></script>
</body>
</html>
